<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Security Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>AI Security Forum</h1>
    </div>
    <button id="newThreadBtn" class="btn-primary">New Thread</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>Topics</h2>
        <ul id="topicList" class="chip-list"></ul>
      </section>
      <section>
        <h2>Risk Levels</h2>
        <ul id="riskList" class="chip-list"></ul>
      </section>
      <section class="stats">
        <h2>Snapshot</h2>
        <p><strong id="threadCount">0</strong> Threads</p>
        <p><strong id="replyCount">0</strong> Replies</p>
      </section>
    </aside>

    <section class="feed-wrap">
      <div class="feed-head">
        <h2>Latest Discussions</h2>
        <input id="searchInput" type="search" placeholder="Search threat model, jailbreak, SOC2..." />
      </div>
      <div id="threadFeed" class="thread-feed"></div>
    </section>
  </main>

  <dialog id="threadDialog">
    <form id="threadForm" method="dialog">
      <h3>Create Thread</h3>
      <label>Title <input name="title" required maxlength="90" /></label>
      <label>Topic
        <select name="topic" required>
          <option value="Prompt Injection">Prompt Injection</option>
          <option value="Model Governance">Model Governance</option>
          <option value="Data Leakage">Data Leakage</option>
          <option value="Supply Chain">Supply Chain</option>
          <option value="Policy Ops">Policy Ops</option>
        </select>
      </label>
      <label>Risk
        <select name="risk" required>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>
      </label>
      <label>Summary <textarea name="summary" required maxlength="260"></textarea></label>
      <menu>
        <button type="button" id="cancelBtn" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary">Post</button>
      </menu>
    </form>
  </dialog>

  <script src="./script.js"></script>
</body>
</html>
